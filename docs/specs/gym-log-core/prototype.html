<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->
<meta charset="utf-8">
<title>Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ── project tokens: copied from app/globals.css (oklch values verbatim) ──
     --font: the project's Inter/Geist web fonts are replaced with a system stack.
     --set-1..5, --up: new tokens; the project's --chart-* tokens are grayscale
     and cannot tell sets apart by color. */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --radius: 0.625rem;
    --font: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --set-1: oklch(0.62 0.17 255);
    --set-2: oklch(0.7 0.13 190);
    --set-3: oklch(0.78 0.15 85);
    --set-4: oklch(0.68 0.18 45);
    --set-5: oklch(0.6 0.2 335);
    --up: oklch(0.55 0.15 150);
  }
  .sh-theme-dark {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --set-1: oklch(0.7 0.15 255);
    --set-2: oklch(0.76 0.12 190);
    --set-3: oklch(0.83 0.14 85);
    --set-4: oklch(0.74 0.16 45);
    --set-5: oklch(0.7 0.18 335);
    --up: oklch(0.75 0.15 150);
    color-scheme: dark;
  }

  /* ── review chrome (sh-*): keep; extend product styles elsewhere ── */
  * { box-sizing: border-box }
  body {
    margin: 0; padding: 0 0 40px;
    background: var(--background, #f6f6f6); color: var(--foreground, #3a3a3a);
    font-family: var(--font, system-ui, sans-serif);
  }
  .sh-bar {
    position: sticky; top: 0; z-index: 999;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; background: #191a1c; color: #d7d7d7;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .sh-bar b, .sh-control-label { color: #8a8f98; font-weight: 500 }
  .sh-control { display: inline-flex; gap: 5px; align-items: center }
  .sh-bar button {
    border: 1px solid #3a3d42; background: none; color: inherit;
    font: inherit; padding: 2px 9px; border-radius: 99px; cursor: pointer;
  }
  .sh-bar select {
    width: 170px; border: 1px solid #3a3d42; background: #232428; color: inherit;
    font: inherit; padding: 3px 28px 3px 9px; border-radius: 7px; cursor: pointer;
    color-scheme: dark;
  }
  #sh-screen { width: 190px }
  .sh-bar button.on { background: #d7d7d7; color: #191a1c; border-color: #d7d7d7 }
  .sh-theme { display: inline-flex; border: 1px solid #3a3d42; border-radius: 99px; overflow: hidden }
  .sh-theme button { border: 0; border-radius: 0; padding: 2px 10px }
  .sh-spacer { flex: 1 }
  .sh-stage { max-width: 960px; margin: 0 auto; padding: 12px 16px 0 }
  [hidden] { display: none !important }

  /* viewport presets */
  .sh-vp-390 .sh-stage {
    max-width: 390px; background: var(--background, #f6f6f6);
    border: 10px solid #191a1c; border-radius: 28px;
    padding: 16px 12px; height: min(844px, calc(100dvh - 52px));
    overflow-y: auto; margin-top: 12px;
  }
  .sh-vp-768 .sh-stage {
    max-width: 768px; border: 1px solid #c4c4c4; border-radius: 12px;
    padding: 16px; margin-top: 12px;
  }

  /* placeholders */
  .wf-pic  { border-radius: 4px; background:
             repeating-linear-gradient(45deg, #e9e9e9, #e9e9e9 6px, #f2f2f2 6px, #f2f2f2 12px) }
  .sh-theme-dark .wf-pic { background: repeating-linear-gradient(45deg,
             color-mix(in srgb, var(--foreground) 16%, transparent) 0 6px,
             color-mix(in srgb, var(--foreground) 8%, transparent) 6px 12px) }

  /* ── product styles ── */
  .sh-stage { font-size: 14px; line-height: 1.45 }
  .sh-stage section { display: flex; flex-direction: column; gap: 14px; min-height: 100%; max-width: 560px; margin: 0 auto }
  .sh-vp-390 .sh-stage section { min-height: calc(100% - 0px) }
  button, input, select { font: inherit; color: inherit }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 12px; border-radius: calc(var(--radius) * .8);
    border: 1px solid var(--border); background: var(--background); color: var(--foreground);
    font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--muted) }
  .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: transparent }
  .btn.primary:hover { opacity: .88 }
  .btn.ghost { border-color: transparent; background: transparent }
  .btn.ghost:hover { background: var(--muted) }
  .btn.sm { height: 30px; padding: 0 9px; font-size: 13px }
  .btn.icon { width: 36px; padding: 0 }
  .btn.danger { color: var(--destructive); border-color: color-mix(in oklch, var(--destructive) 35%, transparent) }
  .btn.danger.armed { background: var(--destructive); color: var(--primary-foreground); border-color: transparent }
  .btn.on { background: var(--primary); color: var(--primary-foreground); border-color: transparent }
  .btn:focus-visible, input:focus-visible, select:focus-visible, .cell:focus-visible, .brand:focus-visible, .bar-hit:focus-visible {
    outline: 2px solid var(--ring); outline-offset: 2px
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px }
  .topbar h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.01em }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: calc(var(--radius) * .8); overflow: hidden }
  .seg button { border: 0; background: none; padding: 0 11px; height: 34px; cursor: pointer; font-weight: 500 }
  .seg button.on { background: var(--primary); color: var(--primary-foreground) }
  .brand-title { display: inline-flex; align-items: center; gap: 8px }
  .mascot { height: 48px; width: auto; flex: none; display: block }
  .tools { display: flex; gap: 8px; align-items: center }
  .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px }
  .label { font-size: 12px; color: var(--muted-foreground); font-weight: 500 }
  .chips { display: flex; flex-wrap: wrap; gap: 6px }
  .chip {
    height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--border);
    background: var(--background); cursor: pointer; font-weight: 500
  }
  .chip.on { background: var(--primary); color: var(--primary-foreground); border-color: transparent }
  .steps { display: flex; flex-direction: column; gap: 10px }
  .brands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px }
  .brand {
    display: flex; flex-direction: column; gap: 6px; padding: 6px; text-align: left;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer
  }
  .brand .wf-pic { aspect-ratio: 4 / 3; display: grid; place-items: center; text-align: center; padding: 6px;
    font-weight: 700; font-size: 13px; color: var(--muted-foreground) }
  .brand .name { font-weight: 600; font-size: 13px; padding: 0 2px }
  .brand .tag { font-size: 11px; color: var(--muted-foreground); padding: 0 2px 2px }
  .brand.on { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary) }
  .sel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px }
  .sel-head { flex-wrap: wrap }
  .sel-head > div:first-child { flex: 1 1 140px; min-width: 0 }
  .sel-head h2 { font-size: 16px; margin: 0; line-height: 1.3 }
  .sel-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted-foreground) }
  .guide { display: flex; flex-direction: column; gap: 10px }
  .guide .wf-pic { aspect-ratio: 16 / 9; display: grid; place-items: center; font-size: 12px; color: var(--muted-foreground); font-weight: 600 }
  .guide ol { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px }
  .play { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: grid; place-items: center; margin: 0 auto 6px }
  .play::after { content: ""; border-left: 12px solid var(--primary-foreground); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px }
  .banner { padding: 9px 11px; border-radius: calc(var(--radius) * .8); background: var(--muted); font-size: 13px; color: var(--muted-foreground) }
  .rows { display: flex; flex-direction: column; gap: 8px }
  .set { display: grid; grid-template-columns: 34px 1fr 1fr 58px; gap: 6px 8px; align-items: center }
  .set .btn.danger { width: 100%; height: 42px; padding: 0 }
  .set .no { font-weight: 700; color: var(--muted-foreground); font-size: 13px }
  .field { position: relative }
  .field input {
    width: 100%; height: 42px; padding: 0 34px 0 10px; border: 1px solid var(--input); border-radius: calc(var(--radius) * .8);
    background: var(--background); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums
  }
  .field .unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted-foreground); pointer-events: none }
  .set .cmp { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted-foreground); margin-top: -2px }
  .diff { font-weight: 700; font-variant-numeric: tabular-nums }
  .diff.up { color: var(--up) }
  .diff.down { color: var(--destructive) }
  .diff.same { color: var(--muted-foreground) }
  .datebar { display: flex; gap: 6px; align-items: center }
  .datebar input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--input); border-radius: calc(var(--radius) * .8); background: var(--background); font-weight: 600 }
  .datebar .btn:disabled { opacity: .4; cursor: default }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
  .strip .label { flex: 0 0 100% }
  .strip .chip { height: 32px; max-width: 100%; padding: 0 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px }
  .strip .chip small { opacity: .7; font-weight: 500 }
  .strip .chip.add { border-style: dashed; color: var(--muted-foreground) }
  .autosave { font-size: 12px; color: var(--muted-foreground); text-align: center }
  .tabbar {
    position: sticky; bottom: -16px; margin: auto -12px -16px; padding: 6px 12px 10px;
    background: var(--background); border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; z-index: 5
  }
  .sh-vp-full .tabbar, body:not(.sh-vp-390):not(.sh-vp-768) .tabbar { bottom: -0px; margin: auto 0 0 }
  .tabbar a {
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
    border-radius: calc(var(--radius) * .8); text-decoration: none; color: var(--muted-foreground); font-size: 12px; font-weight: 600
  }
  .tabbar a svg { width: 20px; height: 20px }
  .tabbar a[aria-current="page"] { color: var(--foreground); background: var(--muted) }
  .spacer-grow { flex: 1 }
  /* calendar */
  .cal-head { display: flex; align-items: center; justify-content: space-between }
  .cal-head h2 { margin: 0; font-size: 16px }
  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center }
  .dow { font-size: 12px; color: var(--muted-foreground); padding: 4px 0; font-weight: 600 }
  .cell {
    position: relative; height: 42px; border: 0; background: none; border-radius: calc(var(--radius) * .7);
    cursor: pointer; font-weight: 500; font-variant-numeric: tabular-nums
  }
  .cell:hover { background: var(--muted) }
  .cell.blank { visibility: hidden }
  .cell.today { box-shadow: inset 0 0 0 1.5px var(--foreground) }
  .cell.sel { background: var(--primary); color: var(--primary-foreground) }
  .cell .dot { position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--set-1) }
  .cell.sel .dot { background: var(--primary-foreground) }
  .day { display: flex; flex-direction: column; gap: 10px }
  .day h3 { margin: 0; font-size: 15px }
  .entry { display: flex; flex-direction: column; gap: 10px }
  .entry-head { display: flex; gap: 10px; align-items: center }
  .entry-head .wf-pic { width: 52px; height: 40px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--muted-foreground); text-align: center; line-height: 1.1 }
  .entry-head .t { flex: 1; min-width: 0 }
  .entry-head .t b { display: block }
  .entry-head .t span { font-size: 12px; color: var(--muted-foreground) }
  .sets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
  .sets li { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums }
  .sets li .s { color: var(--muted-foreground); font-weight: 700; width: 38px }
  .sets li .v { flex: 1; font-weight: 600 }
  .edit-row { display: grid; grid-template-columns: 34px 1fr 1fr auto; gap: 6px; align-items: center }
  .edit-row .field input { height: 38px; font-size: 15px }
  .actions { display: flex; gap: 6px; flex-wrap: wrap }
  .empty { text-align: center; color: var(--muted-foreground); padding: 22px 8px }
  /* chart */
  .chart-wrap svg { width: 100%; height: auto; display: block }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted-foreground) }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px }
  .bar-hit { cursor: pointer }
  .bar-hit.dim .seg-rect { opacity: .45 }
  select.pick {
    width: 100%; height: 40px; padding: 0 10px; border: 1px solid var(--input); border-radius: calc(var(--radius) * .8);
    background: var(--background); font-weight: 600
  }
  .detail ul { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
  .detail li { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums }
  .detail li i { width: 10px; height: 10px; border-radius: 3px; flex: none }
  .detail li span:last-child { margin-left: auto; color: var(--muted-foreground) }

  /* ── PC layout: follows the stage width, so the vp switch previews it ── */
  .sh-stage { container-type: inline-size }
  body:not(.sh-vp-390):not(.sh-vp-768) .sh-stage { max-width: 1120px }
  @container (min-width: 880px) {
    .sh-stage section { max-width: none; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px 28px; align-content: start; align-items: start; min-height: 0 }
    .sh-stage section > .topbar { order: -3; grid-column: 1 / -1 }
    .sh-stage section > .tabbar {
      order: -2; grid-column: 1 / -1; position: static; margin: 0; padding: 0; border: 0;
      border-bottom: 1px solid var(--border); display: flex; gap: 4px; background: none
    }
    .tabbar a { flex-direction: row; gap: 8px; padding: 10px 16px; font-size: 14px; border-radius: calc(var(--radius) * .8) calc(var(--radius) * .8) 0 0 }
    .tabbar a svg { width: 18px; height: 18px }
    .sh-stage section > .strip { order: -1; grid-column: 1 / -1 }
    .spacer-grow { display: none }
    .topbar h1 { font-size: 20px }
    [data-act="change"], #rec-back { display: none !important }
    .chart-main { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px 28px; align-items: start }
    .chart-main .pick { grid-column: 1 / -1; max-width: 420px }
    .sh-stage section > .empty { grid-column: 1 / -1 }
    .chart-wrap svg { max-height: 340px }
  }
</style>

<header class="sh-bar">
  <b>proto</b>
  <label class="sh-control"><span class="sh-control-label">screen</span><select id="sh-screen"></select></label>
  <span class="sh-spacer"></span>
  <label class="sh-control"><span class="sh-control-label">state</span><select id="sh-state"></select></label>
  <button id="sh-vp">vp: full (m)</button>
  <div class="sh-theme" id="sh-theme" role="group" aria-label="theme (t)" hidden>
    <button data-theme="light">light</button><button data-theme="dark">dark</button>
  </div>
</header>

<main class="sh-stage">

  <!-- 기록 -->

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);
  });
  screenSelect.onchange = () => show(screenSelect.value);

  function show(slug) {
    current = screens.find(s => s.dataset.screen === slug) || screens[0];
    screens.forEach(s => s.hidden = s !== current);
    screenSelect.value = current.dataset.screen;
    history.replaceState(null, '', '#' + current.dataset.screen);
    buildStates();
  }

  function buildStates() {
    const declared = (current.dataset.states || '').split(',').map(x => x.trim()).filter(Boolean);
    currentStates = ['Default', ...declared.filter(name => name !== 'Default')];
    stateSelect.innerHTML = '';
    currentStates.forEach(name => {
      const option = document.createElement('option');
      option.textContent = name;
      option.value = name;
      stateSelect.append(option);
    });
    applyState('Default');
  }

  function applyState(name) {
    const active = currentStates.includes(name) ? name : 'Default';
    current.querySelectorAll('[data-when]').forEach(el => {
      el.hidden = !el.dataset.when.split(',').map(x => x.trim()).includes(active);
    });
    stateSelect.value = active;
  }
  stateSelect.onchange = () => applyState(stateSelect.value);

  window.prototypeShell = {
    showScreen: show,
    setState: applyState,
    getScreen: () => current?.dataset.screen,
    getState: () => stateSelect.value
  };

  document.body.classList.add('sh-vp-390');
  const VPS = ['full', '390', '768'];
  let vp = VPS.find(v => document.body.classList.contains('sh-vp-' + v)) || 'full';
  function applyVp() {
    VPS.forEach(v => document.body.classList.toggle('sh-vp-' + v, v === vp && v !== 'full'));
    vpBtn.textContent = 'vp: ' + vp + ' (m)';
    vpBtn.classList.toggle('on', vp !== 'full');
  }
  vpBtn.onclick = () => { vp = VPS[(VPS.indexOf(vp) + 1) % VPS.length]; applyVp(); };
  applyVp();

  const hasDark = [...document.styleSheets].some(sheet => {
    try {
      return [...sheet.cssRules].some(rule => (rule.selectorText || '')
        .split(',').some(part => /\.sh-theme-dark$/.test(part.trim())));
    } catch { return false }
  });
  let dark = false;
  function applyTheme() {
    document.documentElement.classList.toggle('sh-theme-dark', dark);
    document.body.classList.toggle('sh-theme-dark', dark);
    themeBtns.forEach(b => b.classList.toggle('on', (b.dataset.theme === 'dark') === dark));
    if (window.renderTools) renderTools();
  }
  themeCtl.hidden = !hasDark;
  themeBtns.forEach(b => b.onclick = () => { dark = b.dataset.theme === 'dark'; applyTheme(); });
  applyTheme();

  addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const i = screens.indexOf(current);
    if (e.key === 'ArrowRight') show(screens[(i + 1) % screens.length].dataset.screen);
    if (e.key === 'ArrowLeft') show(screens[(i - 1 + screens.length) % screens.length].dataset.screen);
    if (e.key === 'm') vpBtn.click();
    if (e.key === 't' && !themeCtl.hidden) { dark = !dark; applyTheme(); }
  });

  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>

  function renderCalendar() {

  const SET_VARS = ['--set-1', '--set-2', '--set-3', '--set-4', '--set-5'];
  function renderChart() {
    const combos = [...new Set(log.filter(e => e.sets.some(valid)).map(key))];
    if (!combos.includes(chartKey)) chartKey = combos[0];
    $('chart-pick').innerHTML = combos.map(k => { const [ex, b] = k.split('|'); return `<option value="${esc(k)}" ${k === chartKey ? 'selected' : ''}>${esc(b)} ${esc(ex)}</option>`; }).join('');
    const ses = sessionsOf(chartKey).slice(-5);
    const vol = e => e.sets.filter(valid).map(s => s.w * s.r * (unit === 'kg' ? 1 : KG));
    const all = ses.flatMap(vol);
    const step = 100, lo = Math.max(0, Math.floor(Math.min(...all) / step) * step - step), top = Math.ceil(Math.max(...all, 1) / step) * step + step;
    $('chart-unit').textContent = `세트별 운동량 (${unit} × 회) · 최근 ${ses.length}번 운동일`;
    const W = 340, H = 220, L = 40, R = 8, T = 10, B = 28, pw = W - L - R, ph = H - T - B, bw = Math.min(40, pw / ses.length * .6);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 운동일별 세트 운동량 선 차트">`;
    for (let t = 0; t <= 4; t++) {
      const v = lo + (top - lo) / 4 * t, y = T + ph - (v - lo) / (top - lo) * ph;
      svg += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--muted-foreground)">${Math.round(v)}</text>`;
    }
    const sel2 = chartIdx == null ? ses.length - 1 : chartIdx;
    const px = k => L + pw / ses.length * (k + .5), py = v => T + ph - (v - lo) / (top - lo) * ph;
    const maxSets = Math.max(...ses.map(e => e.sets.filter(valid).length), 1);
    svg += `<line x1="${px(sel2)}" x2="${px(sel2)}" y1="${T}" y2="${T + ph}" stroke="var(--border)" stroke-width="1.5"/>`;
    const lines = [];
    for (let si = 0; si < maxSets; si++) lines.push({ color: `var(${SET_VARS[si % 5]})`, w: 2, pts: ses.map((e, k) => { const v = vol(e)[si]; return v == null ? null : [k, v]; }) });
    lines.forEach(l => {
      let run = [];
      const flush = () => { if (run.length > 1) svg += `<polyline points="${run.map(([k, v]) => px(k) + ',' + py(v)).join(' ')}" fill="none" stroke="${l.color}" stroke-width="${l.w}" stroke-linejoin="round" stroke-linecap="round" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''}/>`; run = []; };
      l.pts.forEach(p => { if (p) run.push(p); else flush(); }); flush();
      l.pts.forEach(p => { if (p) svg += `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="${p[0] === sel2 ? 5 : 3}" fill="${l.color}" stroke="var(--card)" stroke-width="1.5"/>`; });
    });
    ses.forEach((e, k) => {
      const on = k === sel2;
      svg += `<g class="bar-hit" data-act="bar" data-v="${k}" tabindex="0" role="button" aria-label="${dlabel(e.date)} 총 ${Math.round(vol(e).reduce((a, b) => a + b, 0))}">
        <rect x="${px(k) - pw / ses.length / 2}" y="${T}" width="${pw / ses.length}" height="${ph + B}" fill="transparent"/>
        <text x="${px(k)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${on ? 'var(--foreground)' : 'var(--muted-foreground)'}" font-weight="${on ? 700 : 500}">${e.date.slice(5).replace('-', '/')}</text></g>`;
    });
    $('chart-svg').innerHTML = svg + '</svg>';
    $('chart-legend').innerHTML = Array.from({ length: Math.min(maxSets, 5) }, (_, i) => `<span><i style="background:var(${SET_VARS[i]})"></i>${i + 1}세트</span>`).join('');
    const pick = ses[chartIdx == null ? ses.length - 1 : chartIdx];
    if (pick) {
      const total = vol(pick).reduce((a, b) => a + b, 0);
      $('chart-detail').innerHTML = `<b>${dlabel(pick.date)}</b><span class="label"> · 총 ${Math.round(total).toLocaleString()} ${unit}×회</span><ul>${pick.sets.filter(valid).map((s, i) => `<li><i style="background:var(${SET_VARS[i % 5]})"></i><span>${i + 1}세트</span><span>${num(s.w)}${unit} × ${s.r}회</span></li>`).join('')}</ul>`;
    }
  }

  function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` }
  function setRecDate(v) { if (!v || v > TODAY) v = TODAY; recDate = v; guideOpen = false; renderAll(); }

  stage.addEventListener('click', ev => {

    if (a === 'open-entry' || a === 'add-ex') {
      if (a === 'open-entry') { const e = log.find(x => x.id === id); Object.assign(sel, { part: e.part, ex: e.ex, brand: e.brand }); recDate = e.date; picking = false; prevSel = null; }
      else { if (prototypeShell.getScreen() !== 'record') recDate = TODAY; prevSel = sel.brand ? { ...sel } : null; picking = true; }
      guideOpen = false; renderAll(); prototypeShell.showScreen('record'); stage.scrollTop = 0; return;
    }
    if (a === 'rec-del-entry') {
      const k = 'x' + id;
      if (armed === k) {
        const e = log.splice(log.findIndex(x => x.id === id), 1)[0]; armed = null; prevSel = null; guideOpen = false;
        const rest = log.filter(x => x.date === e.date && x.sets.some(valid));
        if (rest.length) { Object.assign(sel, { part: rest[0].part, ex: rest[0].ex, brand: rest[0].brand }); picking = false; }
        else { sel.brand = null; picking = true; }
      } else armed = k;
      renderAll(); return;
    }
    if (a === 'rec-del') {
      const e = log.find(x => x.id === id), i = +t.dataset.i, k = 'r' + id + ':' + i;
      if (!valid(e.sets[i]) || armed === k) { e.sets.splice(i, 1); armed = null; } else armed = k;
      renderAll(); return;
    }
    if (a === 'unit') { unit = v; armed = null; renderAll(); return; }
    if (a === 'theme') { dark = !dark; applyTheme(); return; }
    if (a === 'part') { sel.part = v; sel.ex = CATALOG[v][0].ex; sel.brand = null; guideOpen = false; }
    if (a === 'ex') { sel.ex = v; sel.brand = null; guideOpen = false; }
    if (a === 'brand') { sel.brand = v; guideOpen = false; picking = false; prevSel = null; }
    if (a === 'rec-prev' || a === 'rec-next') { const d = new Date(recDate + 'T00:00:00'); d.setDate(d.getDate() + (a === 'rec-next' ? 1 : -1)); setRecDate(iso(d)); return; }
    if (a === 'rec-today') { setRecDate(TODAY); return; }
    if (a === 'change') { prevSel = { ...sel }; picking = true; }
